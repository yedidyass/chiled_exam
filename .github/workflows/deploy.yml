name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CF_API (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      # אופציונלי: נחוץ רק אם לטוקן יש גישה ליותר מחשבון Cloudflare אחד
      - name: Cloudflare account (optional)
        env:
          ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCOUNT_ID" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Ensure D1 database
        run: node scripts/ensure-d1.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx wrangler deploy
